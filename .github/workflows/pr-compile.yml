name: Pull request compile
on:
  pull_request:
    branches: [main]
  push:
    branches: [feature/layout-preview-settings, fix/phase1-stability]
permissions:
  contents: read
jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Test release version policy
        run: python3 -m unittest discover -s tools -p 'test_versions.py'
      - name: Check changed app versions
        if: github.event_name == 'pull_request'
        env:
          VERSION_BASE: ${{ github.event.pull_request.base.sha }}
        run: python3 tools/check_versions.py --base "$VERSION_BASE"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Source regression checks
        run: |
          python3 tools/test_layout_regressions.py
          python3 tools/test_perf.py
      - name: Fetch Quran text needed by generators
        run: |
          mkdir -p quran/src/main/assets
          curl -fsSL --retry 3 "https://tanzil.net/pub/download/index.php?marks=true&sajdah=true&rub=true&alef=true&quranType=uthmani&outType=txt-2&agree=true" -o quran/src/main/assets/quran-uthmani.txt
          test "$(grep -cE '^[0-9]+[|][0-9]+[|]' quran/src/main/assets/quran-uthmani.txt || true)" -eq 6236
      - name: Prepare required generated assets
        run: |
          python3 tools/make_adhkar.py
          python3 tools/make_ayat.py
          python3 tools/pack_fonts.py
      - name: Build all debug apps and instrumentation tests
        run: |
          gradle assembleDebug :app:assembleDebugAndroidTest --no-daemon --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk SahlTV.apk
          cp quran/build/outputs/apk/debug/quran-debug.apk SahlQuran.apk
          cp pdf/build/outputs/apk/debug/pdf-debug.apk SahlPDF.apk
          cp files/build/outputs/apk/debug/files-debug.apk SahlFiles.apk
      - name: Upload test APK
        uses: actions/upload-artifact@v4
        with:
          name: SahlTV-debug-validation
          path: |
            Sahl*.apk
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/androidTest/debug/*.apk
  validate:
    needs: compile
    uses: ./.github/workflows/validate.yml
    with:
      artifact: SahlTV-debug-validation
      source_sha: ${{ github.sha }}
