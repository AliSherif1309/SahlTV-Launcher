name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: Fetch the background photo (Wikimedia Commons, CC BY-SA 4.0) and fit it to 1920x1080
        run: |
          mkdir -p app/src/main/assets
          UA="SahlTV-build/1.0 (https://github.com/AliSherif1309/SahlTV-Launcher)"
          curl -fsSL --retry 3 -A "$UA" "https://commons.wikimedia.org/wiki/Special:FilePath/The_Kaaba_during_Hajj.jpg?width=2560" -o /tmp/kaaba-src.jpg
          pip install --quiet pillow
          python3 -c "from PIL import Image; im=Image.open('/tmp/kaaba-src.jpg').convert('RGB'); print('source', im.size); W,H=1920,1080; s=max(W/im.width,H/im.height); im=im.resize((round(im.width*s),round(im.height*s)),Image.LANCZOS); l=(im.width-W)//2; t=(im.height-H)//2; im.crop((l,t,l+W,t+H)).save('app/src/main/assets/kaaba.jpg',quality=84,optimize=True,progressive=True)"
          ls -la app/src/main/assets/kaaba.jpg
      - name: Fetch Quran text (Tanzil) and font (Amiri Quran), and verify them
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          A=quran/src/main/assets
          curl -fsSL --retry 3 "https://tanzil.net/pub/download/index.php?marks=true&sajdah=true&rub=true&alef=true&quranType=uthmani&outType=txt-2&agree=true" -o $A/quran-uthmani.txt
          n=$(grep -cE '^[0-9]+\|[0-9]+\|' $A/quran-uthmani.txt || true)
          echo "Ayahs in downloaded text: $n"
          test "$n" -eq 6236
          grep -qi "tanzil" $A/quran-uthmani.txt
          curl -fsSL --retry 3 "https://tanzil.net/res/text/metadata/quran-data.js" -o $A/quran-data.js || rm -f $A/quran-data.js
          ls -la $A
          mkdir -p /tmp/amiri && gh release download -R aliftype/amiri -p "Amiri-*.zip" -D /tmp/amiri
          unzip -o -q /tmp/amiri/Amiri-*.zip -d /tmp/amiri/x
          F=$(find /tmp/amiri/x -name "AmiriQuran.ttf" | head -1); test -n "$F"
          cp "$F" $A/AmiriQuran.ttf
          L=$(find /tmp/amiri/x -name "OFL.txt" | head -1); [ -n "$L" ] && cp "$L" $A/Amiri-OFL.txt || true
          ls -la $A
      - name: Build signed release APK
        env:
          KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            export SIGNING_KEYSTORE_PATH="$RUNNER_TEMP/release.jks"
          fi
          gradle assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk SahlTV.apk
          cp quran/build/outputs/apk/release/quran-release.apk SahlQuran.apk
          rm -f "$RUNNER_TEMP/release.jks"
      - uses: actions/upload-artifact@v4
        with:
          name: SahlTV.apk
          path: |
            SahlTV.apk
            SahlQuran.apk
      - name: Publish as the "latest" release (direct download on the phone)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # version.json: what the apps read for "Check for updates"
          python3 - <<'PY'
          import json, os, re, subprocess
          name = lambda f: re.search(r'versionName = "([^"]+)"', open(f).read()).group(1)
          notes = subprocess.run(["git", "log", "-1", "--format=%s"], capture_output=True, text=True).stdout.strip()
          json.dump({"code": 100 + int(os.environ["GITHUB_RUN_NUMBER"]), "sahltv": name("app/build.gradle.kts"),
                     "quran": name("quran/build.gradle.kts"), "notes": notes}, open("version.json", "w"))
          PY
          cat version.json
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest SahlTV.apk SahlQuran.apk version.json --title "Sahl TV launcher (latest build)" \
            --notes "Build ${GITHUB_RUN_NUMBER} (${GITHUB_SHA::7}). On the TV: ☰ Launcher → Check for updates. First install: download **SahlTV.apk** / **SahlQuran.apk** and install with ADB (see README)."
