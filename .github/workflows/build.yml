name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      ref:
        description: "Recovery: rebuild an older version as a new update (e.g. build-128). Leave empty for the newest code."
        required: false
        default: ""
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: Fetch background photos from Wikimedia Commons (licence checked) and fit them to 1920x1080
        run: |
          mkdir -p app/src/main/assets
          pip install --quiet pillow
          python3 tools/fetch_backgrounds.py
          ls -la app/src/main/assets/
      - name: Fetch Quran text (Tanzil) and font (Amiri Quran), and verify them
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          A=quran/src/main/assets
          curl -fsSL --retry 3 "https://tanzil.net/pub/download/index.php?marks=true&sajdah=true&rub=true&alef=true&quranType=uthmani&outType=txt-2&agree=true" -o $A/quran-uthmani.txt
          n=$(grep -cE '^[0-9]+\|[0-9]+\|' $A/quran-uthmani.txt || true)
          echo "Ayahs in downloaded text: $n"
          test "$n" -eq 6236
          grep -qi "tanzil" $A/quran-uthmani.txt
          curl -fsSL --retry 3 "https://tanzil.net/res/text/metadata/quran-data.js" -o $A/quran-data.js || rm -f $A/quran-data.js
          ls -la $A
          mkdir -p /tmp/amiri && gh release download -R aliftype/amiri -p "Amiri-*.zip" -D /tmp/amiri
          unzip -o -q /tmp/amiri/Amiri-*.zip -d /tmp/amiri/x
          F=$(find /tmp/amiri/x -name "AmiriQuran.ttf" | head -1); test -n "$F"
          cp "$F" $A/AmiriQuran.ttf
          L=$(find /tmp/amiri/x -name "OFL.txt" | head -1); [ -n "$L" ] && cp "$L" $A/Amiri-OFL.txt || true
          ls -la $A
      - name: Ayah of the day (verses copied from the verified text) and the Quran font for the launcher
        run: |
          mkdir -p app/src/main/assets
          cp quran/src/main/assets/AmiriQuran.ttf app/src/main/assets/AmiriQuran.ttf; cp quran/src/main/assets/Amiri-OFL.txt app/src/main/assets/ 2>/dev/null || true
          python3 tools/make_ayat.py
          python3 tools/make_adhkar.py
      - name: Thmanyah font (unlocked here, packed scrambled into the apps; the font files are never published)
        env:
          FONT_KEY: ${{ secrets.FONT_KEY }}
        run: python3 tools/pack_fonts.py
      - name: Build signed release APK
        env:
          KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            export SIGNING_KEYSTORE_PATH="$RUNNER_TEMP/release.jks"
          fi
          gradle assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk SahlTV.apk
          cp quran/build/outputs/apk/release/quran-release.apk SahlQuran.apk
          cp pdf/build/outputs/apk/release/pdf-release.apk SahlPDF.apk
          cp files/build/outputs/apk/release/files-release.apk SahlFiles.apk
          rm -f "$RUNNER_TEMP/release.jks"
      - uses: actions/upload-artifact@v4
        with:
          name: SahlTV.apk
          path: |
            SahlTV.apk
            SahlQuran.apk
            SahlPDF.apk
            SahlFiles.apk
      - name: Publish a numbered release (never changed again), then point "latest" to it
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REBUILT_FROM: ${{ inputs.ref }}
        run: |
          set -e
          RUN=$GITHUB_RUN_NUMBER; TAG=build-$RUN; SHA=$(git rev-parse HEAD)
          sha256sum SahlTV.apk SahlQuran.apk SahlPDF.apk SahlFiles.apk > SHA256SUMS
          python3 - <<'PY'
          import json, os, re, subprocess
          name = lambda f: re.search(r'versionName = "([^"]+)"', open(f).read()).group(1)
          run = int(os.environ["GITHUB_RUN_NUMBER"]); repo = os.environ["GITHUB_REPOSITORY"]
          msg = subprocess.run(["git", "log", "-1", "--format=%s"], capture_output=True, text=True).stdout.strip()
          sums = dict(reversed(l.split()) for l in open("SHA256SUMS") if l.strip())
          v = {"sahltv": name("app/build.gradle.kts"), "quran": name("quran/build.gradle.kts"), "pdf": name("pdf/build.gradle.kts"), "files": name("files/build.gradle.kts")}
          # what the apps read for "Check for updates": versions, and where/what to download (numbered release + fingerprints)
          json.dump({"code": 100 + run, "sahltv": v["sahltv"], "quran": v["quran"], "pdfCode": 2100 + run, "pdf": v["pdf"],
                     "filesCode": 100 + run, "files": v["files"], "notes": msg, "build": run,
                     "base": f"https://github.com/{repo}/releases/download/build-{run}/", "sha256": sums}, open("version.json", "w"))
          # stable release notes, from the app's own What's new
          wn = json.load(open("app/src/main/assets/whatsnew.json"))
          rb = os.environ.get("REBUILT_FROM", "")
          notes = [f"## Sahl TV {v['sahltv']} · build {run}", ""]
          if rb: notes += [f"**Recovery build:** the code of `{rb}`, published again with a newer number so TVs can go back to it.", ""]
          notes += ["### What's new"] + [f"- {x}" for x in wn.get("en", [])] + ["", "### الجديد"] + [f"- {x}" for x in wn.get("ar", [])]
          notes += ["", f"Versions: Sahl TV {v['sahltv']} · Sahl Quran {v['quran']} · Sahl PDF {v['pdf']} · Sahl Files {v['files']}",
                    "", f"Commit: `{subprocess.run(['git','rev-parse','--short','HEAD'],capture_output=True,text=True).stdout.strip()}` — {msg}",
                    "", "SHA-256 (the TV checks these before installing):", "```"] + [l.rstrip() for l in open("SHA256SUMS")] + ["```",
                    "", "On the TV: Settings → Check for updates. First install: download the APKs and install with ADB (see README)."]
          open("NOTES.md", "w").write("\n".join(notes) + "\n")
          PY
          cat version.json; echo
          # 1) the numbered release: its own tag on this exact commit, never edited afterwards
          gh release create "$TAG" SahlTV.apk SahlQuran.apk SahlPDF.apk SahlFiles.apk SHA256SUMS version.json \
            --target "$SHA" --title "Sahl TV $(python3 -c "import json;print(json.load(open('version.json'))['sahltv'])") · build $RUN" --notes-file NOTES.md --latest=false
          # 2) "latest" is only a pointer: files replaced in place (never deleted), version.json last,
          #    so a TV never sees a new version before all its files are there
          if gh release view latest >/dev/null 2>&1; then
            gh release upload latest SahlTV.apk SahlQuran.apk SahlPDF.apk SahlFiles.apk SHA256SUMS --clobber
            gh release upload latest version.json --clobber
            gh release edit latest --latest=false --title "Sahl TV (latest = build $RUN)" --notes-file NOTES.md
          else
            gh release create latest --latest=false SahlTV.apk SahlQuran.apk SahlPDF.apk SahlFiles.apk SHA256SUMS version.json --title "Sahl TV (latest = build $RUN)" --notes-file NOTES.md
          fi
          # The numbered build owns GitHub\'s Latest badge; the fixed tag only serves TV downloads.
          gh release edit "$TAG" --latest
