<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="795" viewBox="0 0 1600 795" role="img" aria-labelledby="title desc"><title id="title">Sahl TV home layout guide</title><desc id="desc">Three panels show tile sizes, favorites or recent row ordering, and separate dashboard card arrangements.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#112e32"/><stop offset="1" stop-color="#08171f"/></linearGradient></defs><rect width="1600" height="795" rx="24" fill="url(#bg)"/><g font-family="DejaVu Sans, sans-serif"><text x="55" y="73" fill="#ffffff" font-size="38" font-weight="700">A layout that fits your TV.</text><text x="55" y="111" fill="#b5c9c7" font-size="21" font-weight="400">App tiles and upper dashboard cards have separate controls.</text><rect x="55" y="148" width="484" height="470" rx="18" fill="#142d30" stroke="#315154"/><text x="80" y="192" fill="#d8bd7b" font-size="19" font-weight="700">01</text><text x="80" y="231" fill="#ffffff" font-size="25" font-weight="700">Choose app tiles</text><rect x="558" y="148" width="484" height="470" rx="18" fill="#142d30" stroke="#315154"/><text x="583" y="192" fill="#d8bd7b" font-size="19" font-weight="700">02</text><text x="583" y="231" fill="#ffffff" font-size="25" font-weight="700">Choose your rows</text><rect x="1061" y="148" width="484" height="470" rx="18" fill="#142d30" stroke="#315154"/><text x="1086" y="192" fill="#d8bd7b" font-size="19" font-weight="700">03</text><text x="1086" y="231" fill="#ffffff" font-size="25" font-weight="700">Arrange the dashboard</text><rect x="83" y="280" width="97.5" height="54.75" rx="10" fill="#315951" stroke="#b59c61"/><text x="254" y="315" fill="#caddd5" font-size="18" font-weight="400">Compact · 130 × 73</text><rect x="83" y="384" width="120.0" height="67.5" rx="10" fill="#315951" stroke="#b59c61"/><text x="254" y="419" fill="#caddd5" font-size="18" font-weight="400">Normal · 160 × 90</text><rect x="83" y="505" width="150.0" height="84.0" rx="10" fill="#315951" stroke="#b59c61"/><text x="254" y="540" fill="#caddd5" font-size="18" font-weight="400">Large · 200 × 112</text><text x="584" y="278" fill="#d8bd7b" font-size="14" font-weight="700">FAVORITES FIRST</text><rect x="583" y="294" width="432" height="40" rx="8" fill="#294b49" stroke="#52716a"/><text x="598" y="321" fill="#eaf1ee" font-size="17" font-weight="400">Favorites</text><rect x="583" y="342" width="432" height="40" rx="8" fill="#294b49" stroke="#52716a"/><text x="598" y="369" fill="#eaf1ee" font-size="17" font-weight="400">Recent</text><text x="584" y="420" fill="#d8bd7b" font-size="14" font-weight="700">RECENT FIRST</text><rect x="583" y="436" width="432" height="40" rx="8" fill="#294b49" stroke="#52716a"/><text x="598" y="463" fill="#eaf1ee" font-size="17" font-weight="400">Recent</text><rect x="583" y="484" width="432" height="40" rx="8" fill="#294b49" stroke="#52716a"/><text x="598" y="511" fill="#eaf1ee" font-size="17" font-weight="400">All apps</text><text x="584" y="561" fill="#b5c9c7" font-size="17" font-weight="400">Empty Favorites? Recent moves up.</text><text x="584" y="592" fill="#b5c9c7" font-size="17" font-weight="400">Recent count: 3 / 6 / 8</text><rect x="1087" y="270" width="431" height="72" rx="10" fill="#294b49" stroke="#6d8677"/><text x="1105" y="313" fill="#e9d29b" font-size="20" font-weight="700">Prayer times · full width</text><rect x="1087" y="356" width="208" height="72" rx="18" fill="#142d30" stroke="#315154"/><rect x="1309" y="356" width="209" height="72" rx="18" fill="#142d30" stroke="#315154"/><text x="1105" y="400" fill="#eaf1ee" font-size="20" font-weight="400">Clock</text><text x="1327" y="400" fill="#eaf1ee" font-size="20" font-weight="400">Ayah</text><rect x="1087" y="442" width="431" height="68" rx="18" fill="#142d30" stroke="#315154"/><text x="1105" y="483" fill="#eaf1ee" font-size="20" font-weight="400">Ramadan / chosen card</text><text x="1087" y="553" fill="#b5c9c7" font-size="18" font-weight="400">Show / hide · order · heights</text><text x="1087" y="586" fill="#b5c9c7" font-size="17" font-weight="400">Optional flexible full / half widths</text><rect x="55" y="643" width="1490" height="77" rx="18" fill="#293c34" stroke="#a48c51"/><text x="82" y="691" fill="#eddbb1" font-size="23" font-weight="700">Preview → Apply or Cancel     •     Save a profile     •     Tile sizes keep upper cards unchanged</text><text x="57" y="758" fill="#a2bdb9" font-size="16" font-weight="400">Conceptual guide · dimensions in dp · not to scale · settings and defaults remain under your control</text></g></svg>